# Local development database. Host port 5433 avoids clashing with a local Postgres.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: operations-agent-db
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
